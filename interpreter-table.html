<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Interpreter Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+KR:wght@400;600&family=Noto+Sans+Arabic:wght@400;600&display=swap">
<style>
/* Layout: two facing panels (stacked on phones, side by side on wide screens), one per speaker */
:root{
  --bg:#eef2f4; --panel:#ffffff; --fg:#15202a; --muted:#5a6976; --line:#d6dee4;
  --a:#0d7466; --a-soft:#dff2ee; --b:#b0501c; --b-soft:#fbe9dd; --danger:#b42318;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Noto Sans KR", "Noto Sans Arabic", system-ui, -apple-system, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1419; --panel:#161f27; --fg:#e4ebf0; --muted:#8a99a6; --line:#25313c;
  --a:#3fc3ae; --a-soft:#13312c; --b:#f08c4e; --b-soft:#3a2416; --danger:#f97066; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1419; --panel:#161f27; --fg:#e4ebf0; --muted:#8a99a6; --line:#25313c;
  --a:#3fc3ae; --a-soft:#13312c; --b:#f08c4e; --b-soft:#3a2416; --danger:#f97066; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:12px 16px;max-width:1200px;margin:0 auto}

header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font:700 1.35rem/1.1 var(--display);margin:0;letter-spacing:-.01em;margin-right:auto}
.toggles{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  border-radius:999px;padding:6px 12px;font:500 .82rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--fg)}
.chip[aria-pressed="true"]::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--fg)}
.chip:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:2px}

main{display:grid;grid-template-rows:1fr 1fr;gap:10px;min-height:0}
@media (min-width:820px){main{grid-template-rows:none;grid-template-columns:1fr 1fr}}

.panel{--c:var(--a);--soft:var(--a-soft);background:var(--panel);border:1px solid var(--line);border-radius:14px;
  display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;transition:transform .4s}
.panel.B{--c:var(--b);--soft:var(--b-soft)}
.panel.listening{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
@media (max-width:819px){.flipped .panel.A{transform:rotate(180deg)}}

.ph{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.who{font:700 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.key{font:600 .7rem var(--body);color:var(--muted);background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;white-space:nowrap}
select{margin-left:auto;font:500 .9rem var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px}

.log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:30ch;font-size:.9rem}
.msg{max-width:88%;display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:12px;min-width:0}
.msg.mine{align-self:flex-end;background:var(--soft)}
.msg.theirs{align-self:flex-start;background:var(--bg)}
.msg .main{font-size:1.12rem;line-height:1.45;overflow-wrap:anywhere}
.msg.theirs .main{font-size:1.25rem;font-weight:500}
.msg .sub{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.msg .meta{display:flex;align-items:center;gap:8px;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.msg.live{border:1px dashed var(--c);background:transparent}
.msg.live .meta::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);animation:blink 1s infinite}
.replay{border:0;background:none;color:var(--c);cursor:pointer;font:600 .72rem var(--body);padding:0;letter-spacing:.04em}
@keyframes blink{50%{opacity:.25}}

.controls{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.mic{flex:none;width:52px;height:52px;border-radius:50%;border:0;background:var(--c);color:var(--panel);cursor:pointer;
  display:grid;place-items:center;position:relative}
.mic svg{width:22px;height:22px}
.listening .mic::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);animation:ring 1.2s infinite}
@keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
form{flex:1;display:flex;gap:6px;min-width:0}
form input{flex:1;min-width:0;font:1rem var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
form button{font:600 .85rem var(--body);border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:0 14px;cursor:pointer}

footer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--muted);min-height:1.5em}
#status{min-width:0;flex:1 1 220px}
#status.err{color:var(--danger)}
.actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.save{position:relative}
.save summary{list-style:none}
.save summary::-webkit-details-marker{display:none}
.save .menu{position:absolute;right:0;bottom:calc(100% + 6px);z-index:10;display:flex;flex-direction:column;min-width:230px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.save .menu button{text-align:left;border:0;background:none;color:var(--fg);font:500 .88rem var(--body);padding:9px 10px;border-radius:8px;cursor:pointer}
.save .menu button:hover{background:var(--bg)}
.save .menu{min-width:min(300px,calc(100vw - 32px))}
.review{display:flex;flex-direction:column;gap:6px;padding:8px 10px 10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.check{display:flex;gap:8px;align-items:center;font:600 .86rem var(--body);color:var(--fg);cursor:pointer}
.keyrow{display:flex;gap:6px}
.keyrow input{flex:1;min-width:0;font:.82rem var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.save .menu .keyrow button{border:1px solid var(--line);padding:6px 10px;font-size:.8rem;white-space:nowrap}
.hint{margin:0;font-size:.74rem;color:var(--muted);line-height:1.35}
[dir="rtl"]{text-align:right}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Interpreter Table</h1>
    <div class="toggles">
      <button class="chip" id="tSpeak" aria-pressed="true" type="button">Read translations aloud</button>
      <button class="chip" id="tHands" aria-pressed="false" type="button">Hands-free turns</button>
      <button class="chip" id="tFlip" aria-pressed="false" type="button">Flip top for table</button>
    </div>
  </header>
  <main id="main"></main>
  <footer>
    <span id="status">Tap a mic and start talking.</span>
    <div class="actions">
      <details class="save" id="saveMenu">
        <summary class="chip">Save conversation</summary>
        <div class="menu">
          <div class="review">
            <label class="check"><input type="checkbox" id="reviewOn"> Add suggestions &amp; corrections</label>
            <div class="keyrow">
              <input type="password" id="apiKey" placeholder="Claude API key (sk-ant-…)" autocomplete="off" spellcheck="false">
              <button type="button" id="keySave">Save key</button>
            </div>
            <p class="hint" id="keyHint">Uses your Claude API key. It stays in this browser only and is never uploaded to GitHub.</p>
          </div>
          <button type="button" id="saveDoc">Word document (.doc)</button>
          <button type="button" id="savePdf">PDF (opens print window)</button>
          <button type="button" id="saveTxt">Plain text (.txt)</button>
        </div>
      </details>
      <button class="chip" id="clear" type="button">Clear</button>
    </div>
  </footer>
</div>

<script>
/* speech = what the mic listens for, tr = translation code, tts = voice to read it aloud */
const LANGS = {
  en:  { label: "English",            speech: "en-US",       tr: "en",    tts: "en-US" },
  ko:  { label: "한국어 Korean",       speech: "ko-KR",       tr: "ko",    tts: "ko-KR" },
  ar:  { label: "العربية Arabic",      speech: "ar-SA",       tr: "ar",    tts: "ar-SA" },
  zh:  { label: "普通话 Mandarin",     speech: "cmn-Hans-CN", tr: "zh-CN", tts: "zh-CN" },
  yue: { label: "粵語 Cantonese",      speech: "yue-Hant-HK", tr: "yue",   tts: "zh-HK" },
  es:  { label: "Español Spanish",    speech: "es-ES",       tr: "es",    tts: "es-ES" },
  fr:  { label: "Français French",    speech: "fr-FR",       tr: "fr",    tts: "fr-FR" }
};
const state = {
  A: { lang: "en" }, B: { lang: "ko" },
  messages: [], live: null, active: null, lastSpeaker: null,
  speak: true, handsFree: false
};
const nextSpeaker = () => (state.lastSpeaker ? (state.lastSpeaker === "A" ? "B" : "A") : "A");
const other = s => (s === "A" ? "B" : "A");
const dirOf = l => (l === "ar" ? "rtl" : "ltr");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const cache = new Map();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function setStatus(t, err) { const s = $("status"); s.textContent = t; s.className = err ? "err" : ""; }

/* ---------- Translation (free public endpoints, no key) ---------- */
async function translate(text, sl, tl) {
  text = text.trim();
  if (!text || sl === tl) return text;
  const key = sl + "|" + tl + "|" + text;
  if (cache.has(key)) return cache.get(key);
  const s = LANGS[sl].tr, t = LANGS[tl].tr;
  const alt = c => (c === "yue" ? "zh-TW" : c); // fallback if a service doesn't know Cantonese
  let out;
  try { out = await viaGoogle(text, s, t); }
  catch (e) {
    try {
      if (alt(s) === s && alt(t) === t) throw e;
      out = await viaGoogle(text, alt(s), alt(t));
    } catch (_) { out = await viaMyMemory(text, alt(s), alt(t)); }
  }
  cache.set(key, out);
  return out;
}
async function viaGoogle(text, s, t) {
  const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=" + s + "&tl=" + t + "&q=" + encodeURIComponent(text));
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  return j[0].map(x => x[0]).join("");
}
async function viaMyMemory(text, s, t) {
  const r = await fetch("https://api.mymemory.translated.net/get?langpair=" + s + "|" + t + "&q=" + encodeURIComponent(text));
  const j = await r.json();
  return j.responseData.translatedText;
}

/* ---------- Text to speech ---------- */
/* Chrome often stops long utterances partway, so speak one short chunk at a time */
function splitChunks(text, max = 160) {
  const parts = text.match(/[^.!?。！？؟\n]+[.!?。！？؟]*[\s\n]*/g) || [text];
  const out = []; let cur = "";
  const flush = () => { if (cur.trim()) out.push(cur.trim()); cur = ""; };
  for (let p of parts) {
    while (p.length > max) {
      flush();
      let cut = Math.max(p.lastIndexOf(",", max), p.lastIndexOf("，", max), p.lastIndexOf("、", max), p.lastIndexOf(" ", max));
      if (cut < max / 3) cut = max;
      out.push(p.slice(0, cut + 1).trim());
      p = p.slice(cut + 1);
    }
    if ((cur + p).length > max) flush();
    cur += p;
  }
  flush();
  return out.length ? out : [text];
}
function speak(text, lang, done) {
  if (!state.speak || !window.speechSynthesis || !text) { done && done(); return; }
  speechSynthesis.cancel();
  const tts = LANGS[lang].tts.toLowerCase();
  const voices = speechSynthesis.getVoices(), norm = v => v.lang.toLowerCase().replace("_", "-");
  const v = voices.find(v => norm(v) === tts) || voices.find(v => norm(v).startsWith(tts.split("-")[0]));
  if (!v) setStatus("No " + LANGS[lang].label + " voice installed on this device, so it is shown as text only.");
  const chunks = splitChunks(text);
  let i = 0;
  const next = () => {
    if (i >= chunks.length) { done && done(); return; }
    const u = new SpeechSynthesisUtterance(chunks[i++]);
    u.lang = LANGS[lang].tts;
    if (v) u.voice = v;
    u.onend = next;
    u.onerror = ev => { if (ev.error === "interrupted" || ev.error === "canceled") return; next(); };
    speechSynthesis.speak(u);
  };
  setTimeout(next, 60); // give cancel() a moment so the first chunk isn't dropped
}
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => {};

/* ---------- Speech recognition ---------- */
/* Listens continuously until the speaker finishes: key/mic pressed again, Shift released after holding, or 4s of silence */
let rec = null, liveTimer = null, liveSeq = 0, silenceTimer = null, holding = null;
const SILENCE_MS = 4000;
const listen = { side: null, want: false, finalText: "", interim: "" };
const noSpaceLang = l => l === "zh" || l === "yue";

function finishListening() {
  listen.want = false;
  clearTimeout(silenceTimer);
  if (rec) { try { rec.stop(); } catch (_) { finalize(); } } else finalize();
}
function stopListening() {
  listen.want = false;
  clearTimeout(silenceTimer);
  if (rec) { rec.onend = null; try { rec.abort(); } catch (_) {} rec = null; }
  listen.side = null; listen.finalText = ""; listen.interim = "";
  state.active = null; state.live = null; render();
}
function finalize() {
  const side = listen.side;
  const text = (listen.finalText + (listen.interim ? (noSpaceLang(state[side]?.lang) ? "" : " ") + listen.interim : "")).trim();
  rec = null; listen.side = null; listen.finalText = ""; listen.interim = "";
  state.active = null; state.live = null;
  render();
  if (side && text) commit(side, text);
  else if (side) setStatus("Didn't catch anything. Try again.");
}
function armSilence() {
  clearTimeout(silenceTimer);
  silenceTimer = setTimeout(() => { if (listen.want && !holding) finishListening(); }, SILENCE_MS);
}
function startListening(side) {
  if (!SR) { setStatus("Voice input needs Chrome or Edge. You can still type below each panel.", true); return; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  stopListening();
  state.active = side;
  listen.side = side; listen.want = true;
  openRec(side);
  setStatus("Listening in " + LANGS[state[side].lang].label + "… Press again (or pause for a few seconds) when finished.");
  render();
}
function openRec(side) {
  const lang = state[side].lang;
  const r = new SR();
  rec = r;
  r.lang = LANGS[lang].speech;
  r.continuous = true;
  r.interimResults = true;
  r.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) {
        const t = res[0].transcript.trim();
        if (t) listen.finalText += (listen.finalText && !noSpaceLang(lang) ? " " : "") + t;
      } else interim += res[0].transcript;
    }
    listen.interim = interim.trim();
    const sep = listen.finalText && listen.interim && !noSpaceLang(lang) ? " " : "";
    setLive(side, listen.finalText + sep + listen.interim);
    armSilence();
  };
  r.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      listen.want = false;
      setStatus("Microphone is blocked. Allow mic access from the icon in the address bar, then try again.", true);
    } else if (e.error === "network") {
      setStatus("Speech recognition lost its connection. Check your internet.", true);
    } else if (e.error !== "no-speech" && e.error !== "aborted") {
      setStatus("Speech recognition error: " + e.error, true);
    }
  };
  r.onend = () => {
    if (rec !== r) return;
    // Chrome ends sessions on its own after a while; keep going if the speaker hasn't finished
    if (listen.want && state.active === side) { try { openRec(side); return; } catch (_) {} }
    finalize();
  };
  r.start();
}

function setLive(side, text) {
  state.live = { from: side, original: text, translated: state.live?.translated || "" };
  render();
  clearTimeout(liveTimer);
  const seq = ++liveSeq;
  liveTimer = setTimeout(async () => {
    try {
      const t = await translate(text, state[side].lang, state[other(side)].lang);
      if (seq === liveSeq && state.live) { state.live.translated = t; render(); }
    } catch (_) {}
  }, 350);
}

/* ---------- Messages ---------- */
async function commit(side, text) {
  text = text.trim();
  if (!text) return;
  liveSeq++;
  const to = other(side);
  const m = { from: side, src: state[side].lang, to: state[to].lang, time: Date.now(), original: text, translated: null };
  state.messages.push(m);
  state.lastSpeaker = side;
  render();
  try {
    m.translated = await translate(text, m.src, state[to].lang);
    setStatus("Ready.");
  } catch (e) {
    m.translated = "(Couldn't translate. Check your internet connection.)";
    setStatus("Couldn't reach the translation service. Check your internet connection.", true);
  }
  render();
  speak(m.translated, state[to].lang, () => {
    if (state.handsFree && !state.active) startListening(to);
  });
}

async function retranslateFor(side) {
  for (const m of state.messages) if (m.from !== side) {
    m.translated = null; m.to = state[side].lang; render();
    try { m.translated = await translate(m.original, m.src, state[side].lang); } catch (_) { m.translated = "(Couldn't translate.)"; }
  }
  render();
}

/* ---------- Rendering ---------- */
const micIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const stopIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>';

function buildPanels() {
  $("main").innerHTML = ["A", "B"].map(s => `
    <section class="panel ${s}" id="p${s}">
      <div class="ph">
        <span class="who">Person ${s}</span>
        <kbd class="key" title="Keyboard shortcut">${s === "A" ? "Left" : "Right"} ⇧</kbd>        <select id="lang${s}" aria-label="Person ${s} language">
          ${Object.entries(LANGS).map(([k, v]) => `<option value="${k}" ${state[s].lang === k ? "selected" : ""}>${v.label}</option>`).join("")}
        </select>
      </div>
      <div class="log" id="log${s}" aria-live="polite"></div>
      <div class="controls">
        <button class="mic" id="mic${s}" type="button" aria-label="Talk as Person ${s}">${micIcon}</button>
        <form id="form${s}"><input id="in${s}" autocomplete="off" placeholder="Or type here"><button type="submit">Send</button></form>
      </div>
    </section>`).join("");
  ["A", "B"].forEach(s => {
    $("mic" + s).onclick = () => (state.active === s ? finishListening() : startListening(s));
    $("form" + s).onsubmit = e => { e.preventDefault(); const v = $("in" + s).value; $("in" + s).value = ""; commit(s, v); };
    $("lang" + s).onchange = e => { state[s].lang = e.target.value; render(); retranslateFor(s); };
  });
}

function render() {
  try { localStorage.setItem("interpreterTable", JSON.stringify({ A: state.A.lang, B: state.B.lang, messages: state.messages.filter(m => m.translated !== null) })); } catch (_) {}
  ["A", "B"].forEach(s => {
    const L = state[s].lang;
    const log = $("log" + s);
    const items = state.messages.map((m, i) => bubble(m, s, L, i));
    if (state.live && (state.live.original || state.live.translated)) items.push(bubble(state.live, s, L, -1, true));
    log.innerHTML = items.length ? items.join("")
      : `<p class="empty">Tap the mic and speak ${esc(LANGS[L].label)}. Your words appear in the other panel, translated.</p>`;
    log.scrollTop = log.scrollHeight;
    $("p" + s).classList.toggle("listening", state.active === s);    $("mic" + s).innerHTML = state.active === s ? stopIcon : micIcon;
    $("mic" + s).setAttribute("aria-label", state.active === s ? "Stop listening" : "Talk as Person " + s);
  });
  log_replay();
}

function bubble(m, viewer, L, i, live) {
  const mine = m.from === viewer;
  const mainText = mine ? m.original : (m.translated || (live ? "…" : "Translating…"));
  const subText = mine ? m.translated : m.original;
  const mainLang = mine ? (m.src || state[m.from].lang) : L;
  const subLang = mine ? state[other(m.from)].lang : (m.src || state[m.from].lang);
  const replay = !mine && !live && m.translated ? `<button class="replay" data-i="${i}" data-l="${L}">▶ Play</button>` : "";
  return `<div class="msg ${mine ? "mine" : "theirs"} ${live ? "live" : ""}">
    <span class="meta">${mine ? "You" : "Person " + m.from}${live ? " · speaking" : ""} ${replay}</span>
    <span class="main" dir="${dirOf(mainLang)}" lang="${mainLang}">${esc(mainText)}</span>
    ${subText ? `<span class="sub" dir="${dirOf(subLang)}" lang="${subLang}">${esc(subText)}</span>` : ""}
  </div>`;
}

function log_replay() {
  document.querySelectorAll(".replay").forEach(b => b.onclick = () => {
    const m = state.messages[+b.dataset.i];
    const prev = state.speak; state.speak = true;
    speak(m.translated, b.dataset.l);
    state.speak = prev;
  });
}

/* ---------- Toggles ---------- */
function bindToggle(id, key, cb) {
  $(id).onclick = () => {
    const on = $(id).getAttribute("aria-pressed") !== "true";
    $(id).setAttribute("aria-pressed", on);
    if (key) state[key] = on;
    cb && cb(on);
  };
}
bindToggle("tSpeak", "speak", on => { if (!on && window.speechSynthesis) speechSynthesis.cancel(); });
bindToggle("tHands", "handsFree");
bindToggle("tFlip", null, on => $("app").classList.toggle("flipped", on));
$("clear").onclick = () => { stopListening(); if (window.speechSynthesis) speechSynthesis.cancel(); state.messages = []; state.lastSpeaker = null; render(); setStatus("Cleared."); };

/* ---------- Saving the conversation ---------- */
const pad = n => String(n).padStart(2, "0");
const fmtTime = t => { const d = new Date(t); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
function fileStamp() { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "-" + pad(d.getHours()) + pad(d.getMinutes()); }
function langName(k) { return (LANGS[k] && LANGS[k].label) || k; }

/* ---------- AI review (suggestions & corrections) via the user's own Claude API key ---------- */
const KEY_STORE = "interpreterTableKey", REVIEW_STORE = "interpreterTableReview";
const REVIEW_MODEL = "claude-sonnet-5-5";
let reviewCache = { sig: "", data: null };
function getKey() { try { return localStorage.getItem(KEY_STORE) || ""; } catch (_) { return ""; } }
function setKey(k) { try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch (_) {} }
function reviewWanted() { return $("reviewOn").checked; }

function refreshKeyUI() {
  const has = !!getKey();
  $("apiKey").value = "";
  $("apiKey").placeholder = has ? "Key saved ✓ (paste a new one to replace)" : "Claude API key (sk-ant-…)";
  $("keySave").textContent = has ? "Remove key" : "Save key";
  $("keySave").dataset.mode = has ? "remove" : "save";
}
$("keySave").onclick = () => {
  if ($("keySave").dataset.mode === "remove" && !$("apiKey").value.trim()) {
    setKey(""); refreshKeyUI(); setStatus("API key removed from this browser."); return;
  }
  const k = $("apiKey").value.trim();
  if (!k) { setStatus("Paste your Claude API key first.", true); return; }
  setKey(k); refreshKeyUI(); setStatus("API key saved in this browser.");
};
$("apiKey").addEventListener("input", () => { if ($("apiKey").value.trim()) { $("keySave").textContent = "Save key"; $("keySave").dataset.mode = "save"; } });
$("reviewOn").onchange = () => { try { localStorage.setItem(REVIEW_STORE, $("reviewOn").checked ? "1" : "0"); } catch (_) {} };
try { $("reviewOn").checked = localStorage.getItem(REVIEW_STORE) !== "0"; } catch (_) { $("reviewOn").checked = true; }
refreshKeyUI();

async function getReview() {
  const key = getKey();
  if (!key) throw { friendly: "Add your Claude API key in the Save menu to get suggestions and corrections." };
  const msgs = state.messages.map((m, i) => ({
    i, speaker: "Person " + m.from, language: langName(m.src), said: m.original,
    machine_translation: m.translated || "", translated_into: langName(m.to)
  }));
  const sig = JSON.stringify(msgs);
  if (reviewCache.sig === sig) return reviewCache.data;

  const instructions = `You are reviewing a transcript of a spoken conversation between two people. Each message was captured by automatic speech recognition, then machine-translated for the other person. Help the reader learn from it and catch misunderstandings.

For each message, only where it is genuinely useful:
- "correction": a corrected, natural version of what the speaker said, in the speaker's own language, if it has grammar mistakes, unnatural wording, or likely speech-recognition errors. Leave it null if it was fine.
- "correction_reason": one short sentence explaining the fix.
- "better_translation": a more accurate or natural translation, in the translated_into language, if the machine translation is wrong, awkward, or loses meaning. Leave it null if it was fine.
- "note": optional short note about a possible misunderstanding, tone, or cultural point. Otherwise null.
Skip messages that need nothing.

Also give:
- "summary": one or two sentences describing what the conversation was about.
- "suggestions": two to five short, practical tips for the speakers (useful phrases, clearer ways to say things, misunderstandings to clear up).

Write correction_reason, note, summary and suggestions in English. Keep everything short.
Reply with JSON only, in exactly this shape:
{"summary":"...","items":[{"i":0,"correction":null,"correction_reason":null,"better_translation":null,"note":null}],"suggestions":["..."]}`;

  let r;
  try {
    r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: REVIEW_MODEL,
        max_tokens: 4000,
        system: instructions,
        messages: [{ role: "user", content: "Transcript:\n" + JSON.stringify(msgs, null, 1) }]
      })
    });
  } catch (e) { throw { friendly: "Couldn't reach Claude. Check your internet connection." }; }

  if (!r.ok) {
    let detail = "";
    try { detail = (await r.json()).error.message; } catch (_) {}
    if (r.status === 401) throw { friendly: "Claude didn't accept the API key. Check it in the Save menu." };
    if (r.status === 429) throw { friendly: "Claude is rate-limiting requests right now. Wait a moment and save again." };
    if (r.status === 400 && /credit|billing/i.test(detail)) throw { friendly: "Your Claude account needs credits. Add them in the Claude Console." };
    throw { friendly: "Claude returned an error (" + r.status + ")" + (detail ? ": " + detail : ".") };
  }
  const j = await r.json();
  const text = (j.content || []).filter(c => c.type === "text").map(c => c.text).join("");
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  let data;
  try { data = JSON.parse(text.slice(a, b + 1)); } catch (_) { throw { friendly: "Claude's review came back in an unexpected format. Try saving again." }; }
  data.byIndex = {};
  (data.items || []).forEach(it => { if (it && typeof it.i === "number") data.byIndex[it.i] = it; });
  reviewCache = { sig, data };
  return data;
}

/* ---------- Saved transcript (plain, print-friendly) ---------- */
function transcriptHTML(forPrint, review) {
  const first = state.messages[0], when = new Date(first ? first.time : Date.now());
  const turns = state.messages.map((m, i) => {
    const rv = review && review.byIndex[i];
    let extra = "";
    if (rv && rv.correction) extra += `<p class="fix"><b>Correction:</b> <span dir="${dirOf(m.src)}" lang="${m.src}">${esc(rv.correction)}</span>${rv.correction_reason ? ` <i>(${esc(rv.correction_reason)})</i>` : ""}</p>`;
    if (rv && rv.better_translation) extra += `<p class="fix"><b>Better translation:</b> <span dir="${dirOf(m.to)}" lang="${m.to}">${esc(rv.better_translation)}</span></p>`;
    if (rv && rv.note) extra += `<p class="fix"><b>Note:</b> ${esc(rv.note)}</p>`;
    return `
    <div class="turn">
      <p class="who">${fmtTime(m.time)} - Person ${m.from} (${esc(langName(m.src))})</p>
      <p class="orig" dir="${dirOf(m.src)}" lang="${m.src}">${esc(m.original)}</p>
      <p class="tr" dir="${dirOf(m.to)}" lang="${m.to}">${esc(langName(m.to))}: ${esc(m.translated || "")}</p>
      ${extra}
    </div>`;
  }).join("");
  const summary = review && review.summary ? `<p class="summary"><b>Summary:</b> ${esc(review.summary)}</p>` : "";
  const tips = review && review.suggestions && review.suggestions.length
    ? `<h2>Suggestions</h2><ul>${review.suggestions.map(s => `<li>${esc(s)}</li>`).join("")}</ul>` : "";
  return `<!doctype html><html><head><meta charset="utf-8"><title>Conversation ${fileStamp()}</title>
<style>
body{font-family:Arial,"Apple SD Gothic Neo","PingFang SC","Geeza Pro",sans-serif;color:#000;max-width:700px;margin:24px auto;padding:0 20px;line-height:1.45;font-size:14px}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:16px;margin:24px 0 6px}
.info{margin:0 0 14px;color:#444}
.summary{margin:0 0 14px}
.turn{padding:8px 0;border-top:1px solid #ccc;page-break-inside:avoid}
.who{margin:0;font-size:12px;color:#444}
.orig{margin:2px 0;font-size:15px}
.tr{margin:0;color:#333}
.fix{margin:4px 0 0 16px;color:#222;font-size:13px}
ul{margin:0;padding-left:20px}
[dir=rtl]{text-align:right}
.bar{margin:0 0 16px}
.bar button{font:14px Arial,sans-serif;padding:6px 12px;cursor:pointer}
@media print{.bar{display:none}body{margin:0 auto}}
</style></head><body>
${forPrint ? '<div class="bar"><button onclick="window.print()">Save as PDF / Print</button></div>' : ""}
<h1>Conversation transcript</h1>
<p class="info">${when.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" })} - Person A: ${esc(langName(state.A.lang))} - Person B: ${esc(langName(state.B.lang))} - ${state.messages.length} messages</p>
${summary}
${turns}
${tips}
</body></html>`;
}

function transcriptText(review) {
  const lines = ["Conversation transcript", new Date().toLocaleString(), ""];
  if (review && review.summary) lines.push("Summary: " + review.summary, "");
  state.messages.forEach((m, i) => {
    const rv = review && review.byIndex[i];
    lines.push("[" + fmtTime(m.time) + "] Person " + m.from + " (" + langName(m.src) + ")");
    lines.push("  " + m.original);
    lines.push("  → " + langName(m.to) + ": " + (m.translated || ""));
    if (rv && rv.correction) lines.push("  * Correction: " + rv.correction + (rv.correction_reason ? " (" + rv.correction_reason + ")" : ""));
    if (rv && rv.better_translation) lines.push("  * Better translation: " + rv.better_translation);
    if (rv && rv.note) lines.push("  * Note: " + rv.note);
    lines.push("");
  });
  if (review && review.suggestions && review.suggestions.length) {
    lines.push("Suggestions");
    review.suggestions.forEach(s => lines.push("  - " + s));
  }
  return lines.join("\n");
}

function download(name, type, content) {
  const url = URL.createObjectURL(new Blob(["﻿" + content], { type }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

let saving = false;
async function saveAs(kind) {
  $("saveMenu").open = false;
  if (!state.messages.length) { setStatus("Nothing to save yet. Have a conversation first."); return; }
  if (saving) return;
  // The PDF window must open right away, or the browser treats it as a pop-up
  let w = null;
  if (kind === "pdf") {
    w = window.open("", "_blank");
    if (!w) { setStatus("Your browser blocked the new window. Allow pop-ups for this site and try again.", true); return; }
    w.document.write("<p style='font:15px Arial;margin:24px'>Preparing transcript…</p>");
  }
  let review = null, note = "";
  if (reviewWanted()) {
    saving = true;
    setStatus("Claude is reviewing the conversation for suggestions and corrections…");
    try { review = await getReview(); }
    catch (e) { note = " Saved without suggestions: " + (e && e.friendly ? e.friendly : "the review failed."); }
    saving = false;
  }
  const err = !!note;
  if (kind === "doc") {
    download("conversation-" + fileStamp() + ".doc", "application/msword", transcriptHTML(false, review));
    setStatus("Saved a Word document to your Downloads folder." + note, err);
  } else if (kind === "txt") {
    download("conversation-" + fileStamp() + ".txt", "text/plain;charset=utf-8", transcriptText(review));
    setStatus("Saved a text file to your Downloads folder." + note, err);
  } else {
    w.document.open(); w.document.write(transcriptHTML(true, review)); w.document.close();
    setTimeout(() => { try { w.focus(); w.print(); } catch (_) {} }, 400);
    setStatus("Opened the transcript. Choose Save as PDF in the print window." + note, err);
  }
}
$("saveDoc").onclick = () => saveAs("doc");
$("savePdf").onclick = () => saveAs("pdf");
$("saveTxt").onclick = () => saveAs("txt");
document.addEventListener("click", e => { if (!e.target.closest("#saveMenu")) $("saveMenu").open = false; });

/* Restore the last conversation after a refresh */
try {
  const saved = JSON.parse(localStorage.getItem("interpreterTable") || "null");
  if (saved) {
    if (LANGS[saved.A]) state.A.lang = saved.A;
    if (LANGS[saved.B]) state.B.lang = saved.B;
    if (Array.isArray(saved.messages)) {
      state.messages = saved.messages.filter(m => m && LANGS[m.src]).map(m => ({ ...m, to: m.to || state[m.from === "A" ? "B" : "A"].lang, time: m.time || Date.now() }));
      const last = state.messages[state.messages.length - 1];
      if (last) state.lastSpeaker = last.from;
    }
  }
} catch (_) {}

/* Left Shift = Person A (left panel), Right Shift = Person B (right panel).
   Tap once to start and tap again to finish, or hold while talking and release to finish. */
const SHIFT_SIDE = { ShiftLeft: "A", ShiftRight: "B" };
let shiftDownAt = 0;
const typing = e => e.target.closest && e.target.closest("input, textarea, select");
document.addEventListener("keydown", e => {
  if (e.repeat || e.metaKey || e.ctrlKey || e.altKey || typing(e)) return;
  if (SHIFT_SIDE[e.code]) {
    const side = SHIFT_SIDE[e.code];
    if (state.active === side) { finishListening(); return; }
    startListening(side);
    holding = side; shiftDownAt = performance.now();
  }
});
document.addEventListener("keyup", e => {
  const side = SHIFT_SIDE[e.code];
  if (!side || holding !== side) return;
  holding = null;
  // Held longer than a tap: treat it as push-to-talk and finish on release
  if (performance.now() - shiftDownAt > 600 && state.active === side) finishListening();
  else if (state.active === side) armSilence();
});
window.addEventListener("blur", () => { holding = null; });

buildPanels();
render();
setStatus("Left Shift talks for Person A, Right Shift for Person B. Tap to start and tap again to finish, or hold while you talk.");
if (!SR) setStatus("Voice input needs Chrome or Edge. You can still type below each panel.", true);
</script>
</body>
</html>
